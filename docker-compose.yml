services:
  app:
    restart: always
    container_name: drone-configurator
    build:
      context: .
      dockerfile: ./Dockerfile
    env_file:
      - .env
    environment:
      - PORT=8082
    ports:
      - "8083:8082"
    volumes:
      - /dev:/dev
      - /var/run/wpa_supplicant:/var/run/wpa_supplicant
    devices:
    - /dev/ttyACM0:/dev/ttyACM0
    privileged: true
